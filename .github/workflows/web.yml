name: Web app

# Publishes the web version of ShelfScan to GitHub Pages on every push:
#   https://<owner>.github.io/<repo>/
# Works in any browser (iPhone, Android, laptop) and can be added to the home screen.

on:
  push:
    branches: [main, 'claude/app-planning-development-x0ak8y']
    paths-ignore: ['**.md', 'training/**', 'worker/**', 'scripts/**', 'library/**', 'android/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
